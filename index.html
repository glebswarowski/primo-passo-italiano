<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3e8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Уроки итальянского: карточки, упражнения и разбор ошибок.">
  <title>Primo passo · Итальянский с нуля</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=2">
  <script defer src="./course.js?v=2"></script>
  <script defer src="./app.js?v=2"></script>
</head>
<body>
  <a class="skip-link" href="#panel">К уроку</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Primo passo, главная">
        <span class="brand-mark" aria-hidden="true">P.</span>
        <span class="brand-name"><span lang="it">Primo passo</span><small>Итальянский с нуля</small></span>
      </a>
      <details class="course-picker">
        <summary class="lesson-stamp"><span>Уроки</span><span aria-hidden="true">⌄</span></summary>
        <nav class="course-menu" aria-label="Уроки курса" id="course-menu"></nav>
      </details>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow" id="lesson-label">01 / Первые фразы</p>
          <h1 id="hero-title">Говорим <em>по-итальянски</em></h1>
          <p id="lesson-description">Вспомни первый урок, выучи слова и потренируйся строить фразы. Сайт проверит каждый ответ и объяснит ошибки.</p>
          <div class="hero-actions">
            <button class="primary" type="button" data-jump="notes">Начать урок <span aria-hidden="true">↘</span></button>
            <button class="quiet-link" type="button" data-jump="cards">Сразу к карточкам</button>
          </div>
        </div>
        <div class="hero-art" aria-hidden="true">
          <span class="hero-number" id="lesson-number">01</span>
          <span class="hero-phrase" id="lesson-phrase" lang="it">Parlo italiano.</span>
        </div>
      </section>
      <nav class="path" aria-label="Разделы урока">
        <button class="path-tab" type="button" data-tab="notes"><span class="step-num">01</span><span class="step-label">Разбор</span></button>
        <button class="path-tab" type="button" data-tab="cards"><span class="step-num">02</span><span class="step-label">Карточки</span></button>
        <button class="path-tab" type="button" data-tab="drills"><span class="step-num">03</span><span class="step-label">Практика</span></button>
        <button class="path-tab" type="button" data-tab="exam"><span class="step-num">04</span><span class="step-label">Тест</span></button>
        <button class="path-tab" type="button" data-tab="errors"><span class="step-num">05</span><span class="step-label">Ошибки</span></button>
      </nav>
      <div id="panel" tabindex="-1"><p>Загружаем урок…</p></div>
      <noscript>Чтобы пользоваться карточками и упражнениями, включи JavaScript в браузере.</noscript>
    </main>
    <footer class="footer">
      <span><span lang="it">Primo passo</span> · <span id="footer-lesson">Урок 01</span></span>
      <span>Прогресс хранится в этом браузере</span>
    </footer>
  </div>
</body>
</html>
